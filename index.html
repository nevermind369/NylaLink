<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NAYLA | لباس زیر زنانه </title>
<meta name="description" content="نایلا؛ لباس زیر زنانه با انتخابی خاص و ظرافتی به‌یادماندنی. به تمام صفحات نایلا از همین‌جا دسترسی داشته باشید.">
<meta name="theme-color" content="#F9E4E9">

<!-- Fonts: Vazirmatn (Persian-friendly variable font) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Tailwind CDN (utility layout only — brand colors live in CSS variables below, not here) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { vazir: ['Vazirmatn', 'IRANSans', 'sans-serif'] }
      }
    }
  }
</script>

<!-- =====================================================================================
     COLORS
     Single source of truth for every brand color in the project.
     Change a value here and it updates everywhere on the page automatically.
     ===================================================================================== -->
<style>
  :root{
    /* Brand palette */
    --blossom:        #F7B8C9;   /* primary — soft pink */
    --blossom-soft:    #FBD3DE;   /* primary, lighter tint (icon chips, blobs) */
    --roseGold:        #C98A8A;   /* accent */
    --roseGold-deep:   #9E5B5B;   /* accent, darker — used for text/icons needing contrast */
    --ink:             #2E2E2E;   /* text */
    --paper:           #FFFFFF;   /* secondary */

    /* Background gradient stops */
    --bg-top: #FFF8F9;
    --bg-mid: #FDECF1;
    --bg-bot: #FCE3EC;

    /* Derived surface tokens (built from the palette above — do not hardcode elsewhere) */
    --glass-bg:      color-mix(in srgb, var(--paper) 55%, transparent);
    --glass-border:  color-mix(in srgb, var(--paper) 65%, transparent);
    --shadow-rose:   color-mix(in srgb, var(--roseGold-deep) 22%, transparent);
    --shadow-rose-hi: color-mix(in srgb, var(--roseGold-deep) 35%, transparent);
  }

  *{ -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior:smooth; }

  body{
    font-family:'Vazirmatn','IRANSans',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% 0%, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bot) 100%);
    min-height:100svh;
    overflow-x:hidden;
    position:relative;
  }

  /* Text-color utilities derived from the palette (replaces Tailwind's opacity-suffixed
     color classes so every shade still traces back to a single CSS variable). */
  .text-ink       { color: var(--ink); }
  .text-ink-70    { color: color-mix(in srgb, var(--ink) 70%, transparent); }
  .text-ink-55    { color: color-mix(in srgb, var(--ink) 55%, transparent); }
  .text-ink-50    { color: color-mix(in srgb, var(--ink) 50%, transparent); }
  .text-ink-45    { color: color-mix(in srgb, var(--ink) 45%, transparent); }
  .text-ink-30    { color: color-mix(in srgb, var(--ink) 30%, transparent); }
  .text-rose      { color: var(--roseGold); }
  .text-rose-deep { color: var(--roseGold-deep); }
  .stroke-rose-deep { stroke: var(--roseGold-deep); }
  .stroke-rose      { stroke: var(--roseGold); }

  /* ---------- Ambient background blobs ---------- */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:.45;
    z-index:0;
    pointer-events:none;
    will-change:transform;
  }
  .blob-a{
    width:340px;height:340px;
    top:-120px; right:-90px;
    background:radial-gradient(circle at 30% 30%, var(--blossom-soft), transparent 70%);
    animation:driftA 22s ease-in-out infinite;
  }
  .blob-b{
    width:280px;height:280px;
    bottom:8%; left:-110px;
    background:radial-gradient(circle at 60% 40%, #EFC9C0, transparent 70%);
    animation:driftB 26s ease-in-out infinite;
  }
  .blob-c{
    width:220px;height:220px;
    top:38%; left:52%;
    background:radial-gradient(circle at 50% 50%, var(--blossom), transparent 72%);
    opacity:.28;
    animation:driftC 30s ease-in-out infinite;
  }
  @keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-18px,26px) scale(1.08); } }
  @keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(20px,-22px) scale(1.06); } }
  @keyframes driftC{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-46%,-54%) scale(1.12); } }

  .content-layer{ position:relative; z-index:1; }

  /* ---------- Glassmorphism ---------- */
  .glass{
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--glass-border);
  }

  .eyebrow{ letter-spacing:.32em; }

  /* ---------- Logo (hero wordmark replacement) ---------- */
  .logo-wrap{
    animation:ribbonFloat 7s ease-in-out infinite;
    transform-origin:center;
    filter:drop-shadow(0 14px 28px var(--shadow-rose));
  }
  .logo-img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:9999px;
    image-rendering:-webkit-optimize-contrast;
  }
  @keyframes ribbonFloat{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-8px) rotate(0.6deg); } }

  /* ---------- Link / action buttons (social links, share, website) ---------- */
  .link-card{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .28s ease, border-color .28s ease;
    box-shadow:0 6px 18px -8px var(--shadow-rose);
  }
  .link-card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, color-mix(in srgb, var(--paper) 55%, transparent), color-mix(in srgb, var(--blossom) 15%, transparent) 40%, transparent 70%);
    opacity:0;
    transition:opacity .35s ease;
    z-index:-1;
  }
  .link-card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 34px -12px var(--shadow-rose-hi);
    border-color:color-mix(in srgb, var(--roseGold) 55%, transparent);
  }
  .link-card:hover::before{ opacity:1; }
  .link-card:active{
    transform:translateY(-1px) scale(.985);
    box-shadow:0 8px 18px -10px var(--shadow-rose-hi);
  }
  .link-card:focus-visible{
    outline:2px solid var(--roseGold-deep);
    outline-offset:3px;
  }

  .link-icon{
    background:linear-gradient(145deg, var(--paper), var(--blossom-soft));
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--roseGold) 25%, transparent);
    transition:transform .3s ease;
  }
  .link-card:hover .link-icon{ transform:scale(1.08) rotate(-4deg); }

  .link-card.is-disabled{ opacity:.62; cursor:not-allowed; }
  .link-card.is-disabled:hover{ transform:none; box-shadow:0 6px 18px -8px var(--shadow-rose); }
  .link-card.is-disabled:hover .link-icon{ transform:none; }

  .badge-soon{
    color: var(--roseGold-deep);
    background: color-mix(in srgb, var(--roseGold) 14%, var(--paper));
  }

  /* ---------- Feature cards ---------- */
  .feature-card{ transition:transform .3s ease, box-shadow .3s ease; }
  .feature-card:hover{ transform:translateY(-4px); box-shadow:0 18px 30px -16px var(--shadow-rose-hi); }
  .feature-icon{ background:linear-gradient(145deg, var(--paper), var(--blossom-soft)); }

  /* ---------- Reveal animation ---------- */
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }

  .silk-divider{ height:1px; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--roseGold) 45%, transparent), transparent); }

  ::selection{ background:var(--blossom); color:#5a2e38; }

  /* ---------- Toast (share / copy feedback) ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 16px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:50;
    max-width:calc(100% - 48px);
  }
  .toast.is-visible{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>

<body class="antialiased">

  <!-- Ambient background — purely decorative -->
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="blob blob-c" aria-hidden="true"></div>

  <main class="content-layer max-w-md mx-auto px-6 pt-14 pb-10 sm:max-w-lg">

    <!-- ================= HERO ================= -->
    <!-- Text content below is populated from CONFIG.brand by initHero() — edit CONFIG, not this markup. -->
    <section class="text-center reveal is-visible">
      <p id="hero-eyebrow" class="eyebrow text-[11px] sm:text-xs text-rose-deep font-semibold uppercase mb-4"></p>

      <!-- LOGO -->
      <h1 class="sr-only" id="hero-sr-title"></h1>
      <div class="logo-wrap w-36 sm:w-44 mx-auto mb-3 select-none">
        <img
          id="hero-logo"
          class="logo-img"
          src=""
          alt=""
          width="780"
          height="780"
          decoding="async"
          fetchpriority="high"
        >
      </div>

      <p id="hero-description" class="text-ink-70 text-sm sm:text-base leading-relaxed max-w-xs mx-auto mb-8"></p>
    </section>

    <!-- ================= SOCIAL LINKS ================= -->
    <!-- Cards are generated from CONFIG.links by renderLinks() — add/remove/reorder links there,
         not here. Icon markup lives once in ICONS and is referenced by key. -->
    <nav id="links-nav" class="mt-10 flex flex-col gap-4" aria-label="لینک‌های نایلا"></nav>

    <!-- ================= SHARE ================= -->
    <div class="mt-4">
      <button
        id="share-button"
        type="button"
        class="link-card glass rounded-[22px] flex items-center gap-4 px-5 py-4 group w-full text-right"
      >
        <span class="link-icon w-12 h-12 rounded-2xl flex items-center justify-center shrink-0" data-icon-slot="share"></span>
        <span class="flex-1 text-right">
          <span id="share-title" class="block font-semibold text-ink text-[15px]"></span>
          <span id="share-subtitle" class="block text-ink-50 text-xs mt-0.5"></span>
        </span>
        <span class="w-4 h-4 opacity-60 group-hover:opacity-100 transition-opacity" data-icon-slot="share-arrow"></span>
      </button>
    </div>

    <div class="silk-divider my-12"></div>

    <!-- ================= FEATURES ("Why NAYLA?") ================= -->
    <!-- Cards are generated from CONFIG.features by renderFeatures(). -->
    <section class="reveal" aria-labelledby="why-heading">
      <h2 id="why-heading" class="text-center font-bold text-lg text-ink mb-1"></h2>
      <p id="why-subheading" class="text-center text-ink-55 text-xs mb-7"></p>
      <div id="features-grid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <!-- ================= FOOTER ================= -->
    <footer class="mt-14 text-center reveal">
      <p class="text-[11px] text-ink-45 flex items-center justify-center gap-1">
        ساخته‌شده با
        <span class="text-rose" aria-hidden="true">♥</span>
        <span id="footer-brand"></span>
      </p>
      <p class="text-[10px] text-ink-30 mt-1">© <span id="footer-year"></span> <span id="footer-brand-2"></span></p>
    </footer>

  </main>

  <!-- Toast notification (share / copy-link feedback) -->
  <div id="toast" class="toast glass rounded-2xl px-5 py-3 text-sm font-medium text-ink" role="status" aria-live="polite"></div>

  rubika:    `<rect x="6" y="3.5" width="12" height="17" rx="3"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>`,
  website:   `<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 4 5.4 4 8.5s-1.4 6.1-4 8.5c-2.6-2.4-4-5.4-4-8.5s1.4-6.1 4-8.5z"/>`,
  share:     `<circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="5.5" r="2.4"/><circle cx="17.5" cy="18.5" r="2.4"/><path d="M8.1 10.8l7.4-3.9M8.1 13.2l7.4 3.9"/>`,
  chevron:   `<path d="M9 6l6 6-6 6"/>`,
  quality:   `<path d="M12 3l2.2 5.2L20 9l-4.4 3.9L16.8 19 12 15.9 7.2 19l1.2-6.1L4 9l5.8-.8z"/>`,
  package:   `<path d="M12 3.5l7 3.3v5.6c0 4.4-3 7.6-7 8.9-4-1.3-7-4.5-7-8.9V6.8z"/><path d="M9.2 12l2 2 3.6-3.8"/>`,
  shipping:  `<path d="M3 7h11v8H3z"/><path d="M14 10h4l3 3v2h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/>`,

};

/**
 * Builds a 24x24 SVG string from an ICONS key.
 * fill defaults to "none" so icons drawn purely with strokes (most of the set) keep
 * their line-art look; pass fill:"none" explicitly if an icon needs a filled sub-shape
 * (already encoded per-path via fill="currentColor" where needed, e.g. whatsapp).
 */
function icon(name, { size = 22, strokeVar = "--roseGold-deep" } = {}) {
  const markup = ICONS[name] || "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="var(${strokeVar})" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${markup}</svg>`;
}

/* =====================================================================================
   RENDER FUNCTIONS
   Pure DOM population — read CONFIG/ICONS, write markup. Content edits belong in CONFIG,
   never here.
   ===================================================================================== */

function initHero() {
  const { brand } = CONFIG;
  document.title = `${brand.name} | ${brand.tagline}`;
  document.getElementById("hero-eyebrow").textContent = brand.tagline;
  document.getElementById("hero-sr-title").textContent = `${brand.name} — ${brand.tagline}`;
  document.getElementById("hero-description").textContent = brand.description;

  const logoEl = document.getElementById("hero-logo");
  logoEl.src = brand.logo;
  logoEl.alt = brand.logoAlt;
}

function renderLinks() {
  const nav = document.getElementById("links-nav");
  nav.innerHTML = CONFIG.links.map(link => {
    const disabled = link.enabled === false;
    const tag = disabled ? "div" : "a";
    const attrs = disabled
      ? `role="link" aria-disabled="true" tabindex="0"`
      : `href="${link.url}" target="_blank" rel="noopener noreferrer"`;

    const badge = disabled && link.badge
      ? `<span class="text-[10px] font-semibold badge-soon px-2 py-0.5 rounded-full">${link.badge}</span>`
      : "";

    const trailing = disabled
      ? ""
      : `<span class="w-4 h-4 opacity-60 group-hover:opacity-100 transition-opacity rotate-180">${icon("chevron", { size: 16, strokeVar: "--roseGold" })}</span>`;

    return `
      <${tag} ${attrs} data-link-id="${link.id}"
         class="link-card glass ${disabled ? "is-disabled" : ""} rounded-[22px] flex items-center gap-4 px-5 py-4 group">
        <span class="link-icon w-12 h-12 rounded-2xl flex items-center justify-center shrink-0">${icon(link.icon)}</span>
        <span class="flex-1 text-right">
          <span class="flex items-center gap-2">
            <span class="block font-semibold text-ink text-[15px]">${link.title}</span>
            ${badge}
          </span>
          <span class="block text-ink-50 text-xs mt-0.5">${link.subtitle}</span>
        </span>
        ${trailing}
      </${tag}>`;
  }).join("");
}

function renderFeatures() {
  document.getElementById("why-heading").textContent = "چرا نایلا؟";
  document.getElementById("why-subheading").textContent = "تجربه‌ای که لایق شماست";

  const grid = document.getElementById("features-grid");
  grid.innerHTML = CONFIG.features.map(f => `
    <div class="feature-card glass rounded-3xl px-4 py-5 text-center">
      <div class="feature-icon w-11 h-11 mx-auto mb-3 rounded-2xl flex items-center justify-center">
        ${icon(f.icon, { size: 20 })}
      </div>
      <h3 class="font-semibold text-sm text-ink mb-1">${f.title}</h3>
      <p class="text-[11.5px] text-ink-55 leading-relaxed">${f.description}</p>
    </div>
  `).join("");
}

function initShareButton() {
  document.querySelector('[data-icon-slot="share"]').innerHTML = icon("share");
  document.querySelector('[data-icon-slot="share-arrow"]').innerHTML = icon("chevron", { size: 16, strokeVar: "--roseGold" });
  document.getElementById("share-title").textContent = CONFIG.share.buttonTitle;
  document.getElementById("share-subtitle").textContent = CONFIG.share.buttonSubtitle;

  document.getElementById("share-button").addEventListener("click", handleShare);
}

function initFooter() {
  document.getElementById("footer-brand").textContent = CONFIG.brand.name;
  document.getElementById("footer-brand-2").textContent = CONFIG.brand.name;
  document.getElementById("footer-year").textContent = new Date().getFullYear();
}

/* =====================================================================================
   BEHAVIOR
   Share/copy, toast, disabled-link feedback, scroll reveal, press feedback.
   ===================================================================================== */

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("is-visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2600);
}

async function handleShare() {
  const { shareTitle, shareText, url, toastShared, toastCopied, toastFailed } = CONFIG.share;
  const shareUrl = url || window.location.href;

  if (navigator.share) {
    try {
      await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
      showToast(toastShared);
    } catch (err) {
      if (err.name !== "AbortError") showToast(toastFailed);
    }
    return;
  }

  try {
    await navigator.clipboard.writeText(shareUrl);
    showToast(toastCopied);
  } catch {
    // Last-resort fallback for browsers without Clipboard API access
    const temp = document.createElement("textarea");
    temp.value = shareUrl;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.select();
    try {
      document.execCommand("copy");
      showToast(toastCopied);
    } catch {
      showToast(toastFailed);
    } finally {
      temp.remove();
    }
  }
}

function initDisabledLinkFeedback() {
  document.querySelectorAll(".link-card.is-disabled").forEach(card => {
    const shake = (e) => {
      e.preventDefault();
      card.animate(
        [
          { transform: "translateX(0)" },
          { transform: "translateX(-4px)" },
          { transform: "translateX(4px)" },
          { transform: "translateX(0)" }
        ],
        { duration: 260, easing: "ease-in-out" }
      );
    };
    card.addEventListener("click", shake);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") shake(e);
    });
  });
}

function initPressFeedback() {
  document.querySelectorAll(".link-card:not(.is-disabled)").forEach(card => {
    card.addEventListener("pointerdown", () => card.style.transform = "translateY(-1px) scale(0.985)");
    card.addEventListener("pointerup", () => card.style.transform = "");
    card.addEventListener("pointerleave", () => card.style.transform = "");
  });
}

function initScrollReveal() {
  const revealEls = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add("is-visible"));
  }
  revealEls.forEach((el, i) => { el.style.transitionDelay = (i * 90) + "ms"; });
}

/* =====================================================================================
   INIT
   ===================================================================================== */
document.addEventListener("DOMContentLoaded", () => {
  initHero();
  renderLinks();
  renderFeatures();
  initShareButton();
  initFooter();

  // Re-query dynamic elements only after they exist in the DOM
  initDisabledLinkFeedback();
  initPressFeedback();
  initScrollReveal();
});
</script>
